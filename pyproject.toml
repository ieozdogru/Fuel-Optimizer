[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-optimizer"
version = "0.2.0"
description = "Fuzzy-logic fuel and shift advisory demo with diagnostics and Mamdani/Sugeno comparison"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.28",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-fuzzy>=0.4.2",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "plotly>=5.18",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
py-modules = [
  "main",
  "fuzzy_engine",
  "engine_configs",
  "diagnostics",
  "trajectory",
  "baselines",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
